add:
  fields:
    entity_id:
      example: switch.heater
      selector:
        entity:
    action:
      example: turn_off
      selector:
        select:
          options:
            - turn_on
            - turn_off
            - toggle
          translation_key: action
    service:
      example: climate.set_temperature
      selector:
        text:
    data:
      example: '{"temperature": 18}'
      selector:
        object:
    at:
      example: "20:00"
      selector:
        text:
    in:
      example: 30
      selector:
        number:
          min: 1
          max: 10080
          unit_of_measurement: min
          mode: box
    name:
      example: Heater off
      selector:
        text:
cancel:
  fields:
    id:
      required: true
      example: 3f9a1c2e
      selector:
        text:
run_now:
  fields:
    id:
      required: true
      example: 3f9a1c2e
      selector:
        text:
