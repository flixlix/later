name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Chromium and its system libraries come with the image, so no apt download from Ubuntu mirrors.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The container user does not own the checkout, and checkout's safe.directory only lasts
      # for its own step, so the build id would fall back to "unknown" without this.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint and type checks
        run: pnpm check

      - name: Build card (fails on syntax older browsers cannot parse)
        run: pnpm build:card

      - name: Test
        run: pnpm test
