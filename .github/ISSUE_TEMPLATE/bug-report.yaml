name: 🐛 Bug report
description: Something in Later does not work
labels: ["bug"]
body:
  - type: checkboxes
    id: troubleshooting
    attributes:
      label: Troubleshooting
      options:
        - label: I have searched the existing issues to make sure this is not a duplicate.
          required: true
        - label: I am running the latest version of Later.
          required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.11.2
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where does it happen?
      options:
        - Card
        - Integration (services, timers, restarts)
        - Installation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration or service call
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Home Assistant log lines mentioning `custom_components.later`, and browser console errors.
      render: text
